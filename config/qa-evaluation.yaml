application:
  name: Knowledge Assistant
  version: "0.1"
  environment: evaluation

workspaces:
  evaluation:
    enabled: true
    description: Shareable synthetic M2.4 acceptance corpus
    documents:
      unavailable_root: fatal
      defaults:
        include: ["*.md"]
        exclude: []
        recursive: true
      roots:
        - name: documents
          path: benchmarks/fixtures/m2.4/documents
    artifacts: workspaces/evaluation/artifacts
    collection: m2_4_evaluation

documents:
  include: ["*.md"]
  exclude: []
  recursive: true

pdf_link_download:
  allowed_hosts: []
  allowed_extensions: [".pdf", ".txt", ".md"]
  allowed_content_types: ["application/pdf", "text/plain", "text/markdown"]
  timeout_seconds: 30
  maximum_bytes: 50000000

chunking:
  size: 600
  maximum_size: 1000
  minimum_size: 150
  overlap: 100
  strategy: section
  detect_headings: true

embedding:
  provider: ollama
  model: nomic-embed-text
  batch_size: 32
  version: "1"

llm:
  provider: ollama
  model: qwen3:8b
  temperature: 0.2
  top_p: 0.95
  max_tokens: 2048
  timeout_seconds: 120

question_answering:
  max_context_tokens: 4096
  reserved_output_tokens: 1024
  prompt_name: question_answer

retrieval:
  top_k: 8
  similarity_threshold: 0.00
  max_context_length: 6000
  rerank: false
  cache_policy: reuse

storage:
  provider: chromadb

chroma:
  directory: artifacts/chroma

analysis:
  detect_people: true
  detect_decisions: true
  detect_actions: true
  detect_claims: false
  detect_contradictions: false

prompts:
  question_answer: prompts/question_answer.md
  summarise: prompts/summarise.md
  contradiction: prompts/contradiction.md
  planning: prompts/planning.md

logging:
  level: INFO
  console: true
  file: logs/knowledge_assistant.log
